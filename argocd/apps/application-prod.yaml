apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwp-platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devopswithprashant/k8-dwp.git
    targetRevision: main
    path: charts/dwp-platform
    helm:
      releaseName: dwp-platform-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dwp-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
