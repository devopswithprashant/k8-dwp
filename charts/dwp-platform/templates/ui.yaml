apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwp-platform-ui
  labels:
    app: dwp-platform-ui
    app.kubernetes.io/name: dwp-platform-ui
    app.kubernetes.io/component: frontend
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: dwp-platform-ui
  template:
    metadata:
      labels:
        app: dwp-platform-ui
        app.kubernetes.io/name: dwp-platform-ui
        {{- include "dwp-platform.commonLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          ports:
            - name: http
              containerPort: 80
            - name: nextjs-metrics
              containerPort: 3000
          env:
            - name: BACKEND_SERVICE_HOST
              value: blog-service
            - name: BACKEND_SERVICE_PORT
              value: "8080"
            - name: AUTH_SERVICE_HOST
              value: auth-service
            - name: AUTH_SERVICE_PORT
              value: "8081"
            - name: PROFILE_SERVICE_HOST
              value: profile-service
            - name: PROFILE_SERVICE_PORT
              value: "8080"
            - name: SERVICE_NAME
              value: ui
            - name: NODE_ENV
              value: {{ .Values.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.ui.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: nginx-exporter
          image: {{ .Values.ui.nginxExporter.image | quote }}
          args:
            - -nginx.scrape-uri=http://127.0.0.1:80/nginx_status
          ports:
            - name: nginx-metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dwp-ui-service
  labels:
    app: dwp-platform-ui
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: dwp-platform-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  type: {{ .Values.ui.service.type }}
