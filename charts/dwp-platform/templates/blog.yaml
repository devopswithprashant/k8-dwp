apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  labels:
    app: blog-backend
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.blog.replicas }}
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
        {{- include "dwp-platform.commonLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: blog-backend
          image: "{{ .Values.blog.image.repository }}:{{ .Values.blog.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.blog.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: blog-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: blog-datasource-password
            - name: SERVER_PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: blog-jwt-secret
            - name: PROFILE_SERVICE_BASE_URL
              value: {{ .Values.blog.profileServiceBaseUrl | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: blog-service
  labels:
    app: blog-backend
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: blog-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
