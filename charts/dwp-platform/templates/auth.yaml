apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-backend
  labels:
    app: auth-backend
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: auth-backend
  template:
    metadata:
      labels:
        app: auth-backend
        {{- include "dwp-platform.commonLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-backend
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.auth.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: auth-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: auth-datasource-password
            - name: SERVER_PORT
              value: "8081"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: auth-jwt-secret
            - name: PROFILE_SERVICE_GRPC_TARGET
              value: {{ .Values.auth.profileServiceGrpcTarget | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-backend
    {{- include "dwp-platform.commonLabels" . | nindent 4 }}
spec:
  selector:
    app: auth-backend
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
