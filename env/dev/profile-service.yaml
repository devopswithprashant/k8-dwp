apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: dwp-dev
  labels:
    app: profile-backend
spec:
  selector:
    app: profile-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 9090
      targetPort: 9090
      name: grpc
  type: ClusterIP