# profilepg-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-profile
  namespace: dwp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-profile
  template:
    metadata:
      labels:
        app: postgres-profile
    spec:
      containers:
        - name: postgres-profile
          image: postgres:16
          imagePullPolicy: Never   # ← important!
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: profilepg-secret
          volumeMounts:
            - name: profilepg-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "profileuser", "-d", "profiledb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: profilepg-storage
          persistentVolumeClaim:
            claimName: profilepg-pvc